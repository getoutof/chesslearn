name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Имена jobs (name:) — обязательные проверки в защите main. При переименовании job'а
# обновите список проверок в настройках ветки, иначе PR не смогут смёржиться.
jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна, чтобы сравнить PR с базовой веткой.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      # Сгенерированный код (*.g.dart) хранится в git; если его забыли
      # перегенерировать после правки таблиц drift, — CI падает.
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool
      - name: Comments in Russian
        env:
          BASE_REF: ${{ github.base_ref }}
        run: dart run tool/check_comments.dart ${BASE_REF:+--base origin/$BASE_REF}
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android APK (dev)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      # Для prod-релиза нужен ключ подписи (#28), поэтому CI собирает только dev.
      - run: flutter build apk --release --flavor dev
      - uses: actions/upload-artifact@v4
        with:
          name: chesslearn-dev-apk
          path: build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 14

  ios:
    name: Build iOS (${{ matrix.flavor }}, no codesign)
    needs: check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter build ios --release --no-codesign --flavor ${{ matrix.flavor }}

  # Интеграционные тесты на эмуляторах (#42). Пока не обязательны для main:
  # сначала убедимся, что они стабильны. Скриншоты — в артефактах job'а.
  android-emulator:
    name: Integration test (Android emulator)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      # KVM на раннере есть, но по умолчанию недоступен обычному пользователю,
      # а без него эмулятор x86_64 не запустится.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

  ios-simulator:
    name: Integration test (iOS simulator)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      # Любой iPhone с самой свежей iOS из установленных в образе раннера.
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries | sort_by(.key)[] | select(.key | contains("iOS"))
              | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Simulator: $UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - run: >-
          flutter drive -d "$SIMULATOR_UDID"
          --driver=test_driver/integration_test.dart
          --target=integration_test/app_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
